/* ---- Navy + burgundy + rainbow prism theme ---- */
:root{--bg:#060b22;--card:#0e1744;--tx:#eef1ff;--mut:#aeb8dd;--bl:#ff6f96;--yl:#a3124a;--ln:#26377e;--ok:#2bd48a;--rs:#ffb74d;--no:#ff6b6b;color-scheme:dark}

@keyframes drift{from{transform:translateX(-9%) rotate(0)}to{transform:translateX(9%) rotate(5deg)}}

main,footer{position:relative;z-index:1}
header{background:linear-gradient(90deg,#0b1550,#5c0f2c);border-bottom:2px solid;border-image:linear-gradient(90deg,#ff004c,#ff9a00,#fff176,#00e676,#00b0ff,#7c4dff,#ff4081) 1}

.card{background:rgba(14,23,68,.78);backdrop-filter:blur(6px);box-shadow:0 8px 28px rgba(0,0,0,.3);transition:border-color .25s,box-shadow .25s}

.hero:before{content:"";position:absolute;left:50%;top:50%;width:150%;aspect-ratio:1;margin:-75% 0 0 -75%;background:conic-gradient(from 0deg,#ff004c,#ff9a00,#f6ff00,#00ff7f,#00cfff,#6a5cff,#d400ff,#ff004c);opacity:.2;filter:blur(50px);animation:spin 24s linear infinite;pointer-events:none}
